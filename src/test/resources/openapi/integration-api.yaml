openapi: 3.0.3
info:
  title: Integration API
  version: 1.0.0
paths:
  /users/{userId}:
    get:
      operationId: getUser
      summary: Get user details
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: expand
          in: query
          required: false
          schema:
            type: string
        - name: labels
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: X-Tenant
          in: header
          required: false
          schema:
            type: string
        - name: X-Tags
          in: header
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
  /users:
    post:
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
                - name
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
