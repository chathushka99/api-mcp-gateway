spring:
  application:
    name: enterprise-api-mcp-gateway
  ai:
    mcp:
      server:
        enabled: true
        name: enterprise-api-mcp-gateway
        version: 1.0.0
        type: ASYNC
        protocol: STREAMABLE
        instructions: Dynamically exposes configured OpenAPI operations as MCP tools.
  codec:
    max-in-memory-size: 2MB
gateway:
  operations:
    allow-mutating: true
  security:
    allowed-hosts:
      - localhost
    allow-private-targets: true
  limits:
    connect-timeout: 3s
    max-request-body-bytes: 1048576
    max-response-body-bytes: 2097152
  apis:
    - name: file-storage
      base-url: http://localhost:8081
      openapi: classpath:openapi/file-storage-api.json
      timeout: 30s
      auth:
        type: none
